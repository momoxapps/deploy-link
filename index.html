<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Momox Deployment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: #0d47a1;
            color: white;
            padding: 16px 24px;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            letter-spacing: 0.5px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .icon-wifi {
            display: inline-block;
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            background: #e3f2fd;
            border-radius: 50%;
            line-height: 64px;
            font-size: 28px;
        }

        .btn {
            display: inline-block;
            padding: 18px 40px;
            font-size: 20px;
            font-weight: 600;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            background: #1565c0;
        }

        .btn:active {
            background: #0d47a1;
            transform: scale(0.97);
        }

        .note {
            margin-top: 18px;
            font-size: 14px;
            color: #888;
        }

        .footer {
            text-align: center;
            padding: 16px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="topbar">Momox Deployment</div>

<div class="container">
    <div class="card">
        <div class="icon-wifi">📶</div>
        <button class="btn" onclick="deployProfile()">Update WLAN</button>
        <div class="note"> (MXLEJOFF) </div>
    </div>
</div>

<div class="footer">Momox GmbH</div>

<script>
    function deployProfile() {
        window.location.href = "deploy://applyProfile?name=MDE/Wlan(MXLEJOFF).xml";
    }
</script>

</body>
</html>
